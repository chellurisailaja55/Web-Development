<!DOCTYPE html>
<head>
<title>My Skills</title>
<style>
    table {
        border-collapse: collapse;
        Width: 70%;
        margin:auto;
    }
    th {
        background-color: lightblue;
        color: darkblue;
        font-weight: bold;
        text-align:center;
    }
    td {
        padding: 16px;
        font-weight: bold;
        text-align: center;
    }
    th, td {
    border: 1px solid black;
}
#maintitle {
        color: green;
        font-weight: bold;
        font-size: 30px;
    }
    .Learning {
        color:green;
    }
    .Completed {
        color: blue;
    }
    .HTML {
        color: darkblue;
    }
    .CSS{
        color: darkblue;
    }
    .Excel {
        color: purple;
    }
.Learning:hover {
    background-color: lightgreen;
}
.Completed:hover {
    background-color:lightblue;
}
button {
    background-color: darkblue;
    color: white;
}
button:hover {
    background-color: green;
    cursor: pointer;
}
a {
    color: darkblue;
}
a:hover {
    color:green;
    text-decoration: underline;
}
</style>
</head>
<body>
    <button>Contact Me</button>
    <a href="https://github.com/" target="_blank">View My GitHub</a>
<table>
    <caption id="maintitle">My Skills</caption>
<tr>
    <th>Skills</th>
    <th>Category</th>
    <th>Level</th>
    <th>Status</th>
</tr>
<tr>
    <td class="HTML">HTML</td>
    <td>Web</td>
    <td>Beginner</td>
    <td class="Learning">Learning</td>
</tr>
<tr>
    <td class="CSS">CSS</td>
    <td>Web</td>
    <td>Beginner</td>
    <td class="Learning">Learning</td>
</tr>
<tr>
    <td class="Excel">Excel</td>
    <td>Office</td>
    <td>Basic</td>
    <td class="Completed">Completed</td>
</tr>
</table>
</body>
