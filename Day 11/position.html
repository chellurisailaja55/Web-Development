<!DOCTYPE html>
<head>
    <title>CSS Position Practice</title>
<style>
.box {
    width: 200px;
    height: 100px;
    border:2px solid black;
    background-color: lightblue;
}
.card {
    width: 300px;
    height: 150px;
    border: 2px solid black;
    position: relative;
}
.badge {
        position: absolute;
        top: 10px;
        right: 10px;
    }
</style>
</head>
<body>
    <p>CSS Position Practice</p>
    <div class="box">My Box</div>
    <div class="card">
        <h2>My Product</h2>
        <div class="badge">NEW</div>
    </div>
</body>
</html>
